# The e2e Backstage app (WP09). Everything here is local to the e2e run:
# ports 3100 and 7100 so nothing collides with a Backstage on 3000/7007, an
# in-memory SQLite database so each run starts clean, and guest auth.
app:
  title: SWIRL e2e
  baseUrl: http://localhost:3100

organization:
  name: SWIRL e2e

backend:
  baseUrl: http://localhost:7100
  listen:
    port: 7100
    host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3100
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    guest: {}

# The allow-all policy from create-app is wired in packages/backend/src/index.ts.
# Permissions stay on so the search router runs the query through
# AuthorizedSearchEngine, which is the code path the e2e assertions care about.
permission:
  enabled: true

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

catalog:
  rules:
    - allow:
        [Component, System, API, Resource, Location, Domain, AiResource, User, Group]
  locations:
    # File targets are relative to the backend process, which runs in
    # packages/backend. These are the Backstage example entities copied into
    # e2e/fixtures/catalog, plus the entities WP00 planted for the gate-zero
    # cases (see e2e/fixtures/catalog/planted.yaml).
    - type: file
      target: ../../../fixtures/catalog/all.yaml
    - type: file
      target: ../../../fixtures/catalog/acme-corp.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ../../../fixtures/catalog/planted.yaml

search:
  # The e2e run cannot wait 10 minutes for the first collator pass, and the
  # restart assertion needs the index to survive without one, so the schedule is
  # short and starts almost immediately.
  #
  # The two collators stay 15 seconds apart. The race they used to trip is
  # fixed: POST /swirl/index/<type>/begin/ now takes the generation lock with
  # an exclusive create and writes its bookkeeping row inside that lock, so the
  # second caller gets a clean 409 instead of a 500 over a half-created
  # generation that wedged the type until the TTL expired. Keeping the gap
  # means this suite exercises the ordinary path rather than the race on every
  # run; the race itself is covered by SWIRL's own regression tests
  # (test_views_index.py::test_two_simultaneous_begins_do_not_wedge_the_type).
  collators:
    catalog:
      schedule:
        initialDelay: { seconds: 5 }
        frequency: { seconds: 30 }
        timeout: { minutes: 3 }
    techdocs:
      schedule:
        initialDelay: { seconds: 20 }
        frequency: { seconds: 30 }
        timeout: { minutes: 3 }
  swirl:
    # The SWIRL for Backstage container from e2e/compose.yaml. Host port 8011,
    # not 8001: see e2e/README.md.
    baseUrl: http://localhost:8011
    federated:
      providerTags: ['backstage']
    # Typo tolerance. WP00 cleared the "petsotre" gate-zero case only with
    # fuzzy fields on, and SWIRL ships it off, so the e2e has to turn it on.
    #
    # This is the documented nested camelCase shape from the plugin's
    # config.d.ts. The engine posts it to POST /swirl/index/config/ verbatim,
    # and SWIRL's Tuning.from_dict now folds the nested names onto its own
    # flat ones instead of dropping them, so what an operator writes here is
    # what SWIRL applies. The engine logs the accepted_keys SWIRL answers with
    # at startup, which is how you can see that from the backend log.
    tuning:
      fuzzy:
        enabled: true
        distance: 1
